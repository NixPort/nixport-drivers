    layer: L3
    license: MIT
    origin: fexdroid patches/mesa (原创; 与 gow 拷贝逐字节一致)
  - file: L3-fexdroid/0006-tu-kgsl-power-constraint-from-the-environment.patch
    variants: [main, gen8]
    layer: L3
    license: MIT
    origin: fexdroid patches/mesa (原创; 与 gow 拷贝逐字节一致)
  - file: L3-fexdroid/0007-wsi-x11-sw-frames-straight-to-the-app.patch
    variants: [main, gen8]
    layer: L3
    license: MIT
    origin: gow_android_glibc mesa-patches (fexdroid 原创的变体:
      删除光标取图与逐帧合成, 适配 -nocursor 虚拟显示器)
    notes: fexdroid 原版仅适用于 26.2.3 (本仓库双 pin 上 context 不匹配);
      后果——本仓库产物的软件呈现路径不含驱动侧光标合成, nixport 未来消费
      本仓库产物时若需要光标渲染, 需先做 rebase (记 README 待办)
